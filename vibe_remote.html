
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VibeAmbient Remote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#050c1c;color:#fff;font-family:-apple-system,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px}
h1{font-size:28px;font-weight:300;letter-spacing:.05em;margin-bottom:4px}
.sub{font-size:13px;color:#6688aa;margin-bottom:36px}
.field{width:100%;margin-bottom:12px}
.field label{display:block;font-size:10px;color:#88aabb;letter-spacing:.12em;margin-bottom:5px}
.field input{width:100%;height:46px;background:#0d1e30;border:1px solid #1a3a5c;
             border-radius:10px;color:#fff;font-size:14px;padding:0 14px;
             outline:none;-webkit-appearance:none}
.btn{width:100%;height:60px;border-radius:14px;border:none;font-size:17px;
     font-weight:500;background:#1a4a7a;color:#fff;margin-top:6px;cursor:pointer}
.btn.rec{background:#8b1a1a}
.status{width:100%;background:#0d1e30;border-radius:12px;padding:16px;
        margin-top:20px;display:flex;align-items:center;gap:12px;min-height:64px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}
.dot.p{animation:pulse 1s infinite}
.sl1{font-size:15px;font-weight:300}
.sl2{font-size:11px;color:#6688aa;margin-top:3px}
.divider{color:#334455;font-size:11px;margin:18px 0 4px;width:100%;text-align:center}
.vibes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.vb{height:48px;border-radius:10px;border:1px solid #1a3a5c;
    background:#0d1e30;color:#aaccee;font-size:13px;cursor:pointer}
.vb.on{background:#1a4a7a;border-color:#4488cc;color:#fff}
</style>
</head>
<body>
<h1>VibeAmbient</h1>
<p class="sub">iPhone remote for your TCL TV</p>

<div class="field">
  <label>ACRCLOUD HOST</label>
  <input id="ah" value="identify-ap-southeast-1.acrcloud.com" autocorrect="off" spellcheck="false">
</div>
<div class="field">
  <label>ACRCLOUD ACCESS KEY</label>
  <input id="ak" value="c413c6dd191dae1da3535505aa0c8d0d" autocorrect="off" spellcheck="false">
</div>
<div class="field">
  <label>ACRCLOUD ACCESS SECRET</label>
  <input id="as" type="password" value="Jcl6G4Be6umu2T36vYlbUNKlRgFOpiSyGu1prxko">
</div>
<div class="field">
  <label>LAST.FM API KEY</label>
  <input id="lk" value="a1ccef7f229adbdb11f796074bca715f" autocorrect="off" spellcheck="false">
</div>

<button class="btn" id="mb" onclick="toggle()">Start Listening</button>

<div class="status">
  <div class="dot" id="dot"></div>
  <div>
    <div class="sl1" id="sl1">Ready</div>
    <div class="sl2" id="sl2">Tap Start to begin</div>
  </div>
</div>

<div class="divider">— or set vibe manually —</div>

<div class="vibes">
  <button class="vb" onclick="sv('CHILL',this)">Chill</button>
  <button class="vb" onclick="sv('PARTY',this)">Party</button>
  <button class="vb" onclick="sv('FOCUS',this)">Focus</button>
  <button class="vb" onclick="sv('ROMANTIC',this)">Romantic</button>
  <button class="vb" onclick="sv('DARK',this)">Dark</button>
  <button class="vb" onclick="sv('UNKNOWN',this)">Reset</button>
</div>

<script>
const TOPIC = 'vibeambient-aarushj2023';
let on=false, mr=null, loopTimer=null, stream=null;

function st(l1,l2,pulse){
  document.getElementById('sl1').textContent=l1;
  document.getElementById('sl2').textContent=l2||'';
  document.getElementById('dot').classList.toggle('p',!!pulse);
}

async function sv(vibe, btn) {
  document.querySelectorAll('.vb').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  try {
    const r = await fetch('https://ntfy.sh/'+TOPIC, {method:'POST', body:vibe});
    if(r.ok) { st('Sent: '+vibe,'TV will update in ~10 seconds',false); }
    else { st('Error sending','Try again',false); }
  } catch(e) { st('Network error','Check internet connection',false); }
}

async function toggle() {
  if(on) { stopListen(); } else { await startListen(); }
}

async function startListen() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  } catch(e) {
    st('Mic access denied','Allow mic in Safari Settings → VibeAmbient',false);
    return;
  }
  on=true;
  document.getElementById('mb').textContent='Stop Listening';
  document.getElementById('mb').classList.add('rec');
  st('Listening to room\u2026','Recording 10 seconds\u2026',true);
  recordLoop();
}

function stopListen() {
  on=false;
  clearTimeout(loopTimer);
  if(mr && mr.state!=='inactive') mr.stop();
  if(stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('mb').textContent='Start Listening';
  document.getElementById('mb').classList.remove('rec');
  st('Stopped','',false);
}

async function recordLoop() {
  if(!on) return;
  const chunks=[];
  const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
  mr = new MediaRecorder(stream, {mimeType});
  mr.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
  await new Promise(res => { mr.onstop=res; mr.start(); setTimeout(()=>mr.stop(),10000); });
  if(!on) return;
  st('Identifying song\u2026','Sending to ACRCloud\u2026',true);
  const blob = new Blob(chunks, {type:mimeType});
  const vibe = await identify(blob);
  if(vibe) {
    await sv(vibe, null);
  } else {
    st('No match found','Trying again in 20 seconds\u2026',false);
  }
  if(on) loopTimer = setTimeout(recordLoop, 20000);
}

async function identify(blob) {
  const host   = document.getElementById('ah').value.trim();
  const key    = document.getElementById('ak').value.trim();
  const secret = document.getElementById('as').value.trim();
  const lfKey  = document.getElementById('lk').value.trim();
  if(!host||!key||!secret) return null;
  const ts  = Math.floor(Date.now()/1000);
  const str = 'POST\n/v1/identify\n'+key+'\naudio\n1\n'+ts;
  const sig = await hmac(secret, str);
  const fd  = new FormData();
  fd.append('access_key',key);
  fd.append('sample', blob, 'audio.mp4');
  fd.append('sample_bytes', blob.size.toString());
  fd.append('timestamp', ''+ts);
  fd.append('signature', sig);
  fd.append('signature_version','1');
  fd.append('data_type','audio');
  try {
    const r    = await fetch('https://'+host+'/v1/identify',{method:'POST',body:fd});
    const data = await r.json();
    if(data?.status?.code!==0) return null;
    const music  = data?.metadata?.music?.[0];
    if(!music) return null;
    const title  = music.title||'';
    const artist = music.artists?.[0]?.name||'';
    const bpm    = parseFloat(music.tempo?.value||'0');
    st('\u266a '+title, artist, false);
    if(lfKey && title && artist) {
      const tags = await lfmTags(artist, title, lfKey);
      const v    = classifyTags(tags);
      if(v) return v;
    }
    return bpm>128?'PARTY':bpm<90?'CHILL':'FOCUS';
  } catch(e) { return null; }
}

async function lfmTags(artist, title, key) {
  const url = 'https://ws.audioscrobbler.com/2.0/?method=track.getInfo'
            + '&api_key='+key+'&artist='+encodeURIComponent(artist)
            + '&track='+encodeURIComponent(title)+'&format=json';
  try {
    const r    = await fetch(url);
    const data = await r.json();
    return (data?.track?.toptags?.tag||[]).map(t=>t.name.toLowerCase());
  } catch(e) { return []; }
}

function classifyTags(tags) {
  if(tags.some(t=>['party','dance','edm','club','disco','electronic','house','techno','trance'].includes(t))) return 'PARTY';
  if(tags.some(t=>['chill','ambient','relax','mellow','lo-fi','lofi','calm','peaceful','sleep'].includes(t))) return 'CHILL';
  if(tags.some(t=>['dark','metal','heavy','gothic','industrial','doom','grunge','punk'].includes(t))) return 'DARK';
  if(tags.some(t=>['romantic','love','soul','r&b','rnb','ballad','jazz'].includes(t))) return 'ROMANTIC';
  if(tags.some(t=>['focus','study','classical','instrumental','piano'].includes(t))) return 'FOCUS';
  return null;
}

async function hmac(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret),
              {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}
</script>
</body>
</html>
